    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Made Digital",
        "description": "Web design and development studio creating modern websites for small and growing businesses in Cape Town.",

        "telephone": "+27716140682",

        "currenciesAccepted": "ZAR",
        "areaServed": {
          "@type": "City",
          "name": "Cape Town"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Cape Town",
          "addressCountry": "ZA"
        },
        "founder": {
          "@type": "Person",
          "name": "Melissa Appolis"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",

              "Thursday",

            ],

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!--
      Netlify Forms detection. Netlify's build bot parses static HTML only, so the
      SPA's React forms are declared here once. Field names must match the React
      forms in src/pages/. Delete this block if you move to another form service.
    -->
    <form name="website-review" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="website-review" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="url" name="website" />
      <input type="text" name="industry" />
      <input type="text" name="improve" />
      <textarea name="message"></textarea>
    </form>

    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="text" name="business" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="tel" name="whatsapp" />
      <input type="text" name="need" />
      <input type="text" name="package" />
      <textarea name="message"></textarea>
    </form>
  </body>
