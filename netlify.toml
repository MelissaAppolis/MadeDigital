[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# The invitations are their own static app and must come before the SPA fallback.
[[redirects]]
  from = "/invites/*"
  to = "/invites/index.html"
  status = 200

# SPA fallback — every route serves index.html so refreshing /work/studio-olive
# does not 404. Netlify Forms POSTs are handled before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
